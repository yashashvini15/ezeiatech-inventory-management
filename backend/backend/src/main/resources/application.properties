spring.application.name=inventory

#to import the values from .env
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

#JWT properties
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=http://localhost:5173

#Tax Config
app.order.tax-rate=${ORDER_TAX_RATE:0.18}

#Reports: month/day bucket kis timezone me banenge (IST business ke liye)
app.report.zone=${REPORT_ZONE:Asia/Kolkata}