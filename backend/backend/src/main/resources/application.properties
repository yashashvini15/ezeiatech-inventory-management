spring.application.name=inventory

#to import the values from .env
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

#JWT properties
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

#Tax Config
app.order.tax-rate=${ORDER_TAX_RATE:0.18}

#Reports: month/day bucket kis timezone me banenge (IST business ke liye)
app.report.zone=${REPORT_ZONE:Asia/Kolkata}

#Login rate limit (brute-force protection)
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.max-attempts-per-ip=${LOGIN_MAX_ATTEMPTS_PER_IP:20}
app.security.login.window-seconds=${LOGIN_WINDOW_SECONDS:900}

#Reverse proxy ke peeche asli client IP (rate limit ke liye). Local me none, Docker me compose set karega
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}